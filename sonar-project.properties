sonar.projectKey=foodiego
sonar.projectName=FoodieGo
sonar.projectVersion=1.0.0

sonar.sources=apps/gateway/src,apps/identity-service/src,apps/restaurant-service/src,apps/order-service/src,apps/inventory-service/src,apps/payment-service/src,apps/food-service/src,apps/web/src,packages
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/.venv/**

sonar.javascript.lcov.reportPaths=\
  apps/identity-service/coverage/lcov.info,\
  apps/restaurant-service/coverage/lcov.info,\
  apps/order-service/coverage/lcov.info,\
  apps/inventory-service/coverage/lcov.info,\
  apps/payment-service/coverage/lcov.info,\
  apps/food-service/coverage/lcov.info,\
  apps/web/coverage/lcov.info

sonar.python.coverage.reportPaths=

sonar.coverage.exclusions=**/index.js,**/*.test.js,**/test_*.py

# Quality Gate (tự động chặn CI nếu không đạt)
sonar.qualitygate.wait=true
